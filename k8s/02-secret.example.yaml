# Plantilla de ejemplo. NO usar estos valores en produccion.
# deploy.ps1 genera el Secret real a partir de .env (o de estos valores por defecto).
apiVersion: v1
kind: Secret
metadata:
  name: bonosverde-secrets
  namespace: bonosverde
  labels:
    app.kubernetes.io/part-of: bonosverde
type: Opaque
stringData:
  MYSQL_DATABASE: "bonos_db"
  MYSQL_USER: "bonos"
  MYSQL_PASSWORD: "bonos_pass"
  MYSQL_ROOT_PASSWORD: "root_pass"
  DATABASE_URL: "mysql://bonos:bonos_pass@mysql:3306/bonos_db"
  KEYCLOAK_ADMIN_CLIENT_SECRET: "bonosverde-admin-secret-2026"
  KEYCLOAK_CLI_CLIENT_SECRET: "bonosverde-cli-secret-2026"
  KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: "admin"
  PAYPAL_CLIENT_ID: ""
  PAYPAL_CLIENT_SECRET: ""
  EPAYCO_PUBLIC_KEY: ""
  EPAYCO_PRIVATE_KEY: ""
  EPAYCO_CUST_ID: ""
