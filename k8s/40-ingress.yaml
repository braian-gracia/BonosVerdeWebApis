apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bonosverde
  namespace: bonosverde
  labels:
    app.kubernetes.io/part-of: bonosverde
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: bonosverde.local
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
          - path: /api/bonds
            pathType: Prefix
            backend:
              service:
                name: bonds-service
                port:
                  number: 3002
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 3003
          - path: /api/referrals
            pathType: Prefix
            backend:
              service:
                name: referral-service
                port:
                  number: 3004
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
