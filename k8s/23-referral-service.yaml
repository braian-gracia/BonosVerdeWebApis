apiVersion: apps/v1
kind: Deployment
metadata:
  name: referral-service
  namespace: bonosverde
  labels:
    app: referral-service
    app.kubernetes.io/part-of: bonosverde
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: referral-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: referral-service
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: referral-service
          image: bonosverde/referral-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          envFrom:
            - configMapRef:
                name: bonosverde-config
            - secretRef:
                name: bonosverde-secrets
          env:
            - name: PORT
              value: "3004"
          readinessProbe:
            httpGet:
              path: /api/referrals/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/referrals/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: referral-service
  namespace: bonosverde
  labels:
    app: referral-service
    app.kubernetes.io/part-of: bonosverde
spec:
  type: ClusterIP
  selector:
    app: referral-service
  ports:
    - name: http
      port: 3004
      targetPort: http
